services:
  amr-dashboard:
    build: .
    image: autonomous-amr-fleet-hub:local
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Edge-class emulation: each robot is isolated into its own constrained
  # process/container and communicates only over the Docker UDP network.
  # This is NOT Raspberry Pi/Jetson hardware evidence.
  robot-0:
    image: autonomous-amr-fleet-hub:local
    pull_policy: never
    depends_on:
      - amr-dashboard
    command:
      - python
      - ref_sih_amr/robot/node.py
      - --robot-id
      - robot-0
      - --bind
      - 0.0.0.0:19001
      - --peers
      - robot-1=robot-1:19002,robot-2=robot-2:19003
      - --start
      - 10,1
      - --pickup
      - 1,5
      - --dropoff
      - 5,1
      - --scenario
      - S2_Crossing
      - --start-delay
      - "0"
      - --ticks
      - "120"
    mem_limit: 1g
    cpus: "1.0"

  robot-1:
    image: autonomous-amr-fleet-hub:local
    pull_policy: never
    depends_on:
      - amr-dashboard
    command:
      - python
      - ref_sih_amr/robot/node.py
      - --robot-id
      - robot-1
      - --bind
      - 0.0.0.0:19002
      - --peers
      - robot-0=robot-0:19001,robot-2=robot-2:19003
      - --start
      - 1,6
      - --pickup
      - 21,8
      - --dropoff
      - 22,6
      - --scenario
      - S2_Crossing
      - --start-delay
      - "2"
      - --ticks
      - "120"
    mem_limit: 1g
    cpus: "1.0"

  robot-2:
    image: autonomous-amr-fleet-hub:local
    pull_policy: never
    depends_on:
      - amr-dashboard
    command:
      - python
      - ref_sih_amr/robot/node.py
      - --robot-id
      - robot-2
      - --bind
      - 0.0.0.0:19003
      - --peers
      - robot-0=robot-0:19001,robot-1=robot-1:19002
      - --start
      - 22,7
      - --pickup
      - 13,12
      - --dropoff
      - 16,12
      - --scenario
      - S2_Crossing
      - --start-delay
      - "4"
      - --ticks
      - "120"
    mem_limit: 1g
    cpus: "1.0"
