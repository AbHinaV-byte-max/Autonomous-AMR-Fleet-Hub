name: P2P Acceptance Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/sih26-auto-safety
    paths:
      - "ref_sih_amr/experiments/decentralized_acceptance.py"
      - "ref_sih_amr/sim/**"
      - "ref_sih_amr/robot/**"
      - "ref_sih_amr/comms/**"
      - "ref_sih_amr/experiments/**"
  pull_request:
    branches:
      - main
    paths:
      - "ref_sih_amr/experiments/decentralized_acceptance.py"
      - "ref_sih_amr/sim/**"
      - "ref_sih_amr/robot/**"
      - "ref_sih_amr/comms/**"
      - "ref_sih_amr/experiments/**"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      # Keep PR/push CI bounded. The full 20-trial / 3000-tick matrix remains
      # available through manual workflow_dispatch for evidence generation.
      BENCH_TRIALS: ${{ github.event_name == 'workflow_dispatch' && '20' || '1' }}
      BENCH_MAX_TICKS: ${{ github.event_name == 'workflow_dispatch' && '3000' || '300' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run multi-scenario decentralized acceptance benchmark
        run: python ref_sih_amr/experiments/decentralized_acceptance.py
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2p-acceptance-matrix
          path: artifacts/p2p_acceptance_matrix.json
