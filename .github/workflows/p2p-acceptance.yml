name: P2P Acceptance Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/sih26-auto-safety
    paths:
      - "ref_sih_amr/experiments/decentralized_acceptance.py"
      - "ref_sih_amr/sim/**"
      - "ref_sih_amr/robot/**"
      - "ref_sih_amr/comms/**"
      - "ref_sih_amr/experiments/**"
  pull_request:
    branches:
      - main
    paths:
      - "ref_sih_amr/experiments/decentralized_acceptance.py"
      - "ref_sih_amr/sim/**"
      - "ref_sih_amr/robot/**"
      - "ref_sih_amr/comms/**"
      - "ref_sih_amr/experiments/**"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run multi-scenario decentralized acceptance benchmark
        run: python ref_sih_amr/experiments/decentralized_acceptance.py
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2p-acceptance-matrix
          path: artifacts/p2p_acceptance_matrix.json
