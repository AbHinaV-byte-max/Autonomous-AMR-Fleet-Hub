name: P2P Acceptance Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - fix/sih26-auto-safety
    paths:
      - "ref_sih_amr/experiments/decentralized_acceptance.py"
      - "ref_sih_amr/sim/**"
      - "ref_sih_amr/robot/**"
      - "ref_sih_amr/comms/**"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run decentralized acceptance benchmark
        run: python ref_sih_amr/experiments/decentralized_acceptance.py
